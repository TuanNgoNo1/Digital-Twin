<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USB Camera</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111; color: #ddd; font-family: Arial, Helvetica, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; }
    img { display: block; max-width: 100vw; max-height: 100vh; object-fit: contain; }
    #status { position: fixed; left: 12px; bottom: 10px; padding: 6px 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.62); font-size: 13px; }
  </style>
</head>
<body>
  <main><img id="camera" alt="USB Camera"></main>
  <div id="status">loading USB Camera...</div>
  <script>
    const img = document.getElementById('camera');
    const status = document.getElementById('status');
    let ok = 0;
    let fail = 0;
    function refresh() { img.src = `snapshot.jpg?t=${Date.now()}`; }
    img.onload = () => { ok += 1; status.textContent = `USB Camera online - frames ${ok}`; };
    img.onerror = () => { fail += 1; status.textContent = `waiting for USB Camera - retry ${fail}`; };
    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
